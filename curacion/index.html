<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmiTV · Curación</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>EmiTV · Curación</h1>
  </header>

  <section id="carga">
    <h2>1. Cargar el catálogo</h2>
    <label>Categorías: <input type="file" id="archivo-categorias" accept=".json"></label>
    <label>Canales: <input type="file" id="archivo-canales" accept=".json"></label>
    <p id="estado-carga">Todavía no cargaste nada.</p>
  </section>

    <section id="github">
    <h2>2. GitHub</h2>
    <div class="herramientas">
      <input type="password" id="campo-token" autocomplete="off">
      <button id="boton-guardar-token">Guardar token</button>
      <button id="boton-olvidar-token">Olvidar token</button>
    </div>
    <div class="herramientas">
      <button id="boton-traer">⬇ Traer de GitHub</button>
      <button id="boton-publicar">⬆ Publicar en GitHub</button>
    </div>
    <p id="estado-github"></p>
    </section>

    <section id="servidor">
    <h2>3. Servidor del proveedor</h2>
    <p class="ayuda">Si el proveedor cambia de dirección, cambiala acá: todas las TVs la toman al abrir la app.</p>
    <div class="herramientas">
      <input type="url" id="campo-servidor" placeholder="https://miservidor.com">
      <button id="boton-traer-servidor">⬇ Traer servidor</button>
      <button id="boton-publicar-servidor">⬆ Publicar servidor</button>
    </div>
    <p id="estado-servidor"></p>
    </section>

  <main id="explorador">
    <aside>
      <h2>Categorías</h2>
      <ul id="lista-categorias"></ul>
    </aside>

    <section>
      <input type="search" id="buscador" placeholder="Buscar canal en todo el catálogo…">
      <h2 id="titulo-canales">Elegí una categoría</h2>
      <ul id="lista-canales"></ul>
    </section>

    <section id="panel-lista">
      <h2>Tu lista</h2>
      <div class="pestanas">
        <button id="pestana-simple" class="pestana"></button>
        <button id="pestana-completa" class="pestana"></button>
      </div>
      <div class="herramientas">
        <button id="boton-exportar">Exportar lista.json</button>
        <button id="boton-importar">Importar lista.json</button>
        <input type="file" id="archivo-importar" accept=".json" hidden>
      </div>
      <ul id="avisos"></ul>
      <ul id="mi-lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
